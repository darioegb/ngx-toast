name: Setup pnpm, Node and dependencies
description: Installs pnpm (via packageManager), sets up Node with pnpm caching, and installs dependencies with a frozen lockfile.
inputs:
  registry-url:
    description: Optional npm registry URL to configure (needed for publish steps).
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      shell: bash
