<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 250" width="1024" height="1024" role="img" aria-label="ngx-toastf logo">
  <!-- Angular shield, same red as the rest of the ngx-* libs -->
  <polygon points="125,30 31.9,63.2 46.1,186.7 125,230 203.9,186.7 218.1,63.2" fill="#d52127" stroke="#d52127" stroke-width="6" stroke-linejoin="round"/>
  <g fill="#fff">
    <!-- front toast -->
    <rect x="62" y="76" width="126" height="50" rx="10"/>
    <!-- stacked toasts -->
    <rect x="74" y="134" width="102" height="18" rx="7"/>
    <rect x="90" y="160" width="70" height="14" rx="6" opacity="0.65"/>
  </g>
  <!-- check badge + text lines of the front toast -->
  <circle cx="86" cy="101" r="14" fill="#d52127"/>
  <path d="M79.5 101.5l5 5 9-10.5" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="108" y="90" width="68" height="8" rx="4" fill="#d52127"/>
  <rect x="108" y="105" width="44" height="7" rx="3.5" fill="#d52127" opacity="0.55"/>
</svg>
