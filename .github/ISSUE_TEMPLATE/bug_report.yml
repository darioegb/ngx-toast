name: Bug Report
description: Report a problem with ngx-toastf
labels: ['bug']
body:
  - type: input
    id: lib-version
    attributes:
      label: ngx-toastf version
      placeholder: e.g. 2.0.0
    validations:
      required: true
  - type: input
    id: angular-version
    attributes:
      label: Angular version
      placeholder: e.g. 22.2.0
    validations:
      required: true
  - type: dropdown
    id: setup-style
    attributes:
      label: How is ngx-toastf configured in your app?
      options:
        - 'Standalone - provideNgxToast()'
        - 'NgModule - NgxToastModule.forRoot()'
        - 'Zero-config (no provider setup)'
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps to reproduce, ideally a Stackblitz link or minimal repo.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: false
